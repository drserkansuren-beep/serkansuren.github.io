<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dr. Serkan Süren — HTML Paylaşım Testi</title>
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f7fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17324d; }
    main { width:min(88%,680px); padding:40px; background:white; border-radius:22px; box-shadow:0 16px 50px rgba(28,63,94,.12); text-align:center; }
    .ok { display:inline-grid; place-items:center; width:64px; height:64px; border-radius:50%; background:#e3f7eb; color:#138a4b; font-size:36px; }
    h1 { margin:20px 0 12px; font-size:clamp(26px,5vw,42px); }
    p { margin:0; font-size:18px; line-height:1.6; color:#526a80; }
  </style>
</head>
<body>
  <main>
    <div class="ok">✓</div>
    <h1>HTML paylaşım sistemi hazır</h1>
    <p>Bu sayfa GitHub üzerinden yayımlanmıştır ve WhatsApp bağlantısı olarak paylaşılabilir.</p>
  </main>
</body>
</html>
